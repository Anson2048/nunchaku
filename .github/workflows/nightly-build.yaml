name: Nightly Build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-wheel:
    name: Build the windows torch2.7 py3.11 wheel
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
          
      - name: 安装 CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.0'
          use-github-cache: false
           
      - name: Install torch 2.7 + CUDA 12.8
        run: |
          pip install torch==2.7.0+cu128 --index-url https://download.pytorch.org/whl/cu128
          # 你可能还需要 torchvision/torchaudio，根据项目需求

      - name: Build wheel
        shell: cmd
        run: |
          REM 如需conda，按你脚本原流程，否则用pip即可
          python -m build --wheel

      - name: List dist
        run: dir dist

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nunchaku-torch2.7-cp311-win_amd64
          path: dist/*.whl
