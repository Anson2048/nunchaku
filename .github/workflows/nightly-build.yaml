name: Build win torch2.7 py3.11 wheel

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup CUDA 12.6
        uses: Jimver/cuda-toolkit@v0.12.0
        with:
          cuda: '12.6.0'

      - name: Upgrade pip & install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Install torch 2.7.0+cu126
        run: |
          pip install torch==2.7.0+cu126 --index-url https://download.pytorch.org/whl/cu126

      - name: Build wheel (pip build)
        run: |
          python -m build --wheel

      - name: List dist directory
        run: dir dist

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nunchaku-torch2.7.0+cu126-cp311-win_amd64
          path: dist/*.whl
